name: Daily scraper

on:
  schedule:
    # 02:00 UTC daily — after most European matches have finished
    - cron: "0 2 * * *"
  workflow_dispatch: # allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/pyproject.toml

      - name: Install dependencies
        working-directory: scraper
        run: |
          pip install -e ".[dev]"
          playwright install chromium --with-deps

      - name: Run daily incremental scrape
        working-directory: scraper
        run: |
          # TODO (Phase 5): replace with actual entry point
          echo "Daily scrape not yet implemented — scaffolding only"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Scrape failed — check workflow logs"
