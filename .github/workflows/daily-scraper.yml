name: Daily scraper

on:
  schedule:
    # 02:00 UTC daily — after most European matches have finished
    - cron: "0 2 * * *"
  workflow_dispatch: # allow manual trigger

# Don't let a slow run overlap the next day's run.
concurrency:
  group: daily-scraper
  cancel-in-progress: false

jobs:
  scrape:
    # GitHub-hosted runners are datacenter IPs, which Cloudflare flags quickly.
    # Daily volume is low (a match-day's games) so this usually gets through, and
    # each run is a fresh IP. If it starts failing on blocks, register a
    # self-hosted runner on a residential connection (e.g. Max's Mac) and change
    # this to:  runs-on: [self-hosted]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/pyproject.toml

      - name: Install dependencies
        working-directory: scraper
        run: |
          pip install -e ".[dev]"
          playwright install chromium --with-deps

      - name: Run daily incremental scrape
        working-directory: scraper
        run: python scripts/daily_update.py

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -H "Content-Type: application/json" \
              -d '{"content":"⚠️ Daily football scrape failed — check the GitHub Actions logs."}' \
              "$DISCORD_WEBHOOK_URL" || true
          else
            echo "Daily scrape failed. Set the DISCORD_WEBHOOK_URL repo secret for push alerts."
          fi
