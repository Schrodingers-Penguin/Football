name: Diagnose refresh timeout

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: scraper
        run: pip install -e .
      - working-directory: scraper
        run: |
          python - <<'PY'
          import base64, json, os, sys, time
          sys.path.insert(0, ".")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          # print only the role claim — never the key itself
          try:
              p = key.split(".")[1]
              p += "=" * (-len(p) % 4)
              claims = json.loads(base64.urlsafe_b64decode(p))
              print("jwt role claim:", claims.get("role"), "| iss:", claims.get("iss"))
          except Exception as e:
              print("not a decodable JWT (new-style publishable/secret key?):", type(e).__name__)
              # key *type* only (sb_secret / sb_publishable) — not the key material
              print("key type:", "_".join(key.split("_")[:2]))
          from src.db import get_client
          c = get_client()
          t0 = time.time()
          try:
              c.rpc("refresh_dashboard_views").execute()
              print(f"refresh OK in {time.time() - t0:.1f}s")
          except Exception as e:
              print(f"refresh FAILED after {time.time() - t0:.1f}s: {str(e)[:200]}")
          PY
